# config/sources.yaml
# ---------------------------------------------------------------------------
# The single source-of-truth gate for the corpus. Adding a URL here is the ONLY
# way a page enters the RAG index. See PRD.md S4.2 (allowed) / S4.3 (banned).
# ---------------------------------------------------------------------------

defaults:
  user_agent: "Mozilla/5.0 (compatible; MF-FAQ-RAG-Bot/1.0; educational class project)"
  timeout_seconds: 30
  retries: 3
  backoff_seconds: 2
  politeness_delay_seconds: 2

# The 5 seed scheme pages -- one per category, all Direct Growth.
#
# `aliases` are OTHER NAMES THE SAME FUND GOES BY ON PUBLIC PAGES. They exist
# because retrieval is name-driven: the Flexi Cap page carries the title "HDFC
# Flexi Cap Direct Plan Growth" but the URL slug is hdfc-equity-fund-direct-
# growth, so a user asking about either name must reach the same chunks. Only
# names that actually appear in a public source for this fund may be listed -
# an invented alias is a fabricated fact.
schemes:
  - scheme_slug: hdfc-large-cap-fund-direct-growth
    scheme_name: "HDFC Large Cap Fund - Direct Growth"
    short_name: "HDFC Large Cap"
    aliases: []
    category: "Large Cap"
    asset_class: "Equity"
    plan: "Direct Growth"
    url: "https://groww.in/mutual-funds/hdfc-large-cap-fund-direct-growth"
    page_type: scheme_page
    publisher: Groww

  - scheme_slug: hdfc-equity-fund-direct-growth
    scheme_name: "HDFC Equity Fund - Direct Growth"
    short_name: "HDFC Flexi Cap"
    # Both names are in public use for this fund: the page title says "HDFC
    # Flexi Cap Direct Plan Growth" and the canonical URL says
    # hdfc-equity-fund-direct-growth.
    aliases:
      - "HDFC Flexi Cap Fund - Direct Growth"
      - "HDFC Flexi Cap Direct Plan Growth"
    category: "Flexi Cap"
    asset_class: "Equity"
    plan: "Direct Growth"
    url: "https://groww.in/mutual-funds/hdfc-equity-fund-direct-growth"
    page_type: scheme_page
    publisher: Groww

  - scheme_slug: hdfc-elss-tax-saver-fund-direct-plan-growth
    scheme_name: "HDFC ELSS Tax Saver Fund - Direct Plan - Growth"
    short_name: "HDFC ELSS"
    aliases: []
    category: "ELSS"
    asset_class: "Equity"
    plan: "Direct Growth"
    url: "https://groww.in/mutual-funds/hdfc-elss-tax-saver-fund-direct-plan-growth"
    page_type: scheme_page
    publisher: Groww

  - scheme_slug: hdfc-small-cap-fund-direct-growth
    scheme_name: "HDFC Small Cap Fund - Direct Growth"
    short_name: "HDFC Small Cap"
    aliases: []
    category: "Small Cap"
    asset_class: "Equity"
    plan: "Direct Growth"
    url: "https://groww.in/mutual-funds/hdfc-small-cap-fund-direct-growth"
    page_type: scheme_page
    publisher: Groww

  - scheme_slug: hdfc-balanced-advantage-fund-direct-growth
    scheme_name: "HDFC Balanced Advantage Fund - Direct Growth"
    short_name: "HDFC Balanced Advantage"
    aliases: []
    category: "Balanced Advantage"
    asset_class: "Hybrid"
    plan: "Direct Growth"
    url: "https://groww.in/mutual-funds/hdfc-balanced-advantage-fund-direct-growth"
    page_type: scheme_page
    publisher: Groww

# Supplementary public pages from the official regulator / industry bodies.
# The brief asks for AMC / SEBI / AMFI pages in addition to the 5 scheme pages.
#
# `fetch: true`  -> downloaded, cleaned, chunked, embedded, searchable.
# `fetch: false` -> LINK ONLY. The URL is used as an educational hyperlink in
#                   advice/performance refusals, never fetched and never embedded.
#
# FINDINGS from running Stage 1a on 2026-09-27 (see data/ingestion_log.jsonl):
#   * sebi.gov.in      - TLS connection forcibly reset from this environment
#                         (WinError 10054) for every path tried. Link-only.
#   * investor.gov.in  - DNS does not resolve. Link-only.
#   * amfiindia.com/investor-education - HTTP 404 (site restructured). Link-only.
#   * amfiindia.com/mutual-fund       - HTTP 200, ~3.9k visible chars. FETCHED,
#                         then REJECTED by the Stage 2 corpus gate.
#   * hdfcmf.com/*                     - HTTP 200 but a 44-char JS shell. Link-only.
#   * groww.in/help                    - HTTP 200, ~7.1k visible chars. FETCHED,
#                         then REJECTED by the Stage 2 corpus gate.
#
# STAGE 2 OUTCOME for the two fetched supplementary pages: both were downloaded
# and cleaned without error, and both were then dropped by the Stage 2 corpus
# quality gate (ingest/chunk.py:document_is_answerable) because they yielded zero
# fact-bearing nodes and their remaining nodes averaged 34 and 55 characters -
# they are a search box and a footer nav, not documents. They stay in this file
# with fetch: true on purpose: re-running Stage 1a must keep re-proving that
# these pages are empty, and the rejection is reported loudly in chunk_stats.json
# rather than silently edited away.
#
# This is a real, documented constraint, not a workaround: the 5 mandated Groww
# scheme pages are the authoritative corpus and they all fetched cleanly.
#
# CONSEQUENCE, stated plainly: the answerable corpus is 5 pages. Every question in
# the golden set must be answerable from them, and the questions that are not
# (riskometer level, how to download a capital-gains statement) are deliberately
# kept in eval/ as OUT-OF-CORPUS cases that must trigger the refusal path.
supplementary:
  - doc_id: amfi-mutual-fund-basics
    title: "AMFI - Mutual funds: basics, NAV, riskometer and benchmark"
    publisher: AMFI
    url: "https://www.amfiindia.com/mutual-fund"
    page_type: amfi_page
    enabled: true
    fetch: true
    indexed: false
    indexed_blocked_reason: "corpus gate: no fact nodes, mean node 34 chars (nav/search shell)"
    used_for: "riskometer / benchmark / NAV educational context"

  - doc_id: groww-help-statement-guides
    title: "Groww Help Centre - statements, tax documents and downloads"
    publisher: Groww
    url: "https://groww.in/help"
    page_type: guide_page
    enabled: true
    fetch: true
    indexed: false
    indexed_blocked_reason: "corpus gate: no fact nodes, mean node 55 chars (footer nav)"
    used_for: "how to download capital gains statement, tax docs, transaction reports"

  # --- LINK ONLY ---------------------------------------------------------
  - doc_id: sebi-riskometer-explainer
    title: "SEBI - Riskometer and product suitability"
    publisher: SEBI
    url: "https://www.sebi.gov.in/sebiweb/other/OtherAction.do?doMutualFund=yes"
    page_type: regulator_page
    enabled: true
    fetch: false
    fetch_blocked_reason: "TLS reset (WinError 10054) from this environment"
    used_for: "advice-refusal educational link"

  - doc_id: sebi-investor-education
    title: "SEBI - Investor education and mutual funds"
    publisher: SEBI
    url: "https://www.sebi.gov.in/sebiweb/other/OtherAction.do?doInvestorEdu=yes"
    page_type: regulator_page
    enabled: true
    fetch: false
    fetch_blocked_reason: "TLS reset (WinError 10054) from this environment"
    used_for: "advice-refusal educational link"

  - doc_id: amfi-investor-education
    title: "AMFI - Investor education centre"
    publisher: AMFI
    url: "https://www.amfiindia.com/investor-education"
    page_type: regulator_page
    enabled: true
    fetch: false
    fetch_blocked_reason: "HTTP 404 - amfiindia.com restructured this path"
    used_for: "advice-refusal educational link"

  - doc_id: hdfc-amc-faq
    title: "HDFC AMC - Frequently asked questions"
    publisher: HDFC AMC
    url: "https://www.hdfcmf.com/faqs"
    page_type: amc_page
    enabled: true
    fetch: false
    fetch_blocked_reason: "HTTP 200 but a 44-character JavaScript shell"
    used_for: "expense ratio, exit load, switch charges (verification only)"
